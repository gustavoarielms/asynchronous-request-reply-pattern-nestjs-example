name: Example Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  example-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      redis:
        image: redis:8.6.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand

      - name: Build project
        run: npm run build

      - name: Run example smoke test
        run: npm run smoke:example
