name: Example Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  example-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      redis:
        image: redis:8.6.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          cache: npm

      - name: Check workflow Action pins
        run: npm run check:workflow-actions

      - name: Test workflow Action pin checker
        run: npm run test:workflow-actions

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run e2e tests
        run: npm run test:e2e -- --runInBand

      - name: Build project
        run: npm run build

      - name: Run example smoke test
        run: npm run smoke:example
