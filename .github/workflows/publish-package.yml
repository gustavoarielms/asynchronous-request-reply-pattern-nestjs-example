name: Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release-commit: ${{ steps.release.outputs.release-commit }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag, version, and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^nestjs-async-request-reply-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          release_version="${BASH_REMATCH[1]}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release tag version $release_version does not match package.json $package_version" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          if [[ "$release_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked out commit does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag $RELEASE_TAG is not part of main" >&2
            exit 1
          fi

          echo "release-commit=$release_commit" >> "$GITHUB_OUTPUT"

  publish-npm-package:
    needs: validate-release
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.validate-release.outputs.release-commit }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build project
        run: npm run build

      - name: Build package
        run: npm run build:package

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
